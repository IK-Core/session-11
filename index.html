<style>
:root{--cyan:#02b6c9;--green:#8ace39;--magenta:#941a69;--teal:#006b77;--ink:#192f37;--muted:#50666f;--line:#d6e4e7;--mist:#edf6f6;color-scheme:light;font:16px/1.5 "Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;color:var(--ink);background:radial-gradient(ellipse at 0 0,#d8f4f3,transparent 48%),radial-gradient(ellipse at 100% 100%,#f4e6ef,transparent 42%),#f1f6f6;min-height:100vh}.shell{width:min(1100px,calc(100% - 40px));margin:auto}header{display:flex;align-items:center;gap:20px;padding:23px 0 20px}.brand{font-weight:850;font-size:25px;letter-spacing:.16em}.brand .c{color:var(--teal)}.brand .o{color:#457916}.brand .d{color:var(--magenta)}.session{border-left:1px solid #b9d1d5;padding-left:20px;font-size:12px;color:var(--muted)}.session b{display:block;font-size:15px;color:var(--ink)}.utility{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto;justify-content:flex-end}.kicker{color:var(--teal);font-size:12px;font-weight:750;letter-spacing:.12em;text-transform:uppercase}.kicker::before{content:"";display:inline-block;width:7px;height:7px;background:var(--green);border-radius:50%;margin-right:8px}h1,h2,h3,p{margin:0 0 12px}h1{font-size:clamp(29px,4.7vw,46px);line-height:1.1;letter-spacing:-.04em;max-width:700px}h2{font-size:23px;line-height:1.25;letter-spacing:-.02em}h3{font-size:16px}.lede{font-size:17px;color:var(--muted);max-width:740px}.muted,small{color:var(--muted)}small{font-size:12px}button,input,textarea,select{font:inherit;color:inherit}button,.button{min-height:40px;padding:8px 13px;border:1px solid var(--line);border-radius:8px;background:white;cursor:pointer;font-size:14px;font-weight:650;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}button:hover,.button:hover{background:var(--mist)}button:disabled{opacity:.5;cursor:default}.primary{background:var(--ink);color:white;border-color:var(--ink)}.primary:hover{background:#284f59}.quiet{background:transparent;border-color:transparent}.utility button{font-size:12px;min-height:34px;padding:5px 8px}.danger{color:#982448}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--magenta);outline-offset:3px}.progress-head{display:flex;justify-content:space-between;gap:15px;font-size:12px;margin:0 0 6px}.track{height:5px;border-radius:5px;background:#d5e4e7;overflow:hidden;margin-bottom:16px}.track div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--green),var(--magenta));transition:width .25s}.stages{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:0 0 14px}.stages button{padding:10px 6px;display:flex;flex-direction:column;gap:3px;border-color:transparent;background:transparent;color:var(--muted);font-size:11px;letter-spacing:.06em}.stages .num{font-size:13px;width:25px;height:25px;border:1px solid #b9ced3;border-radius:50%;display:grid;place-items:center;background:#fff}.stages button[aria-current=step]{color:var(--teal);background:#fff;border-color:var(--line)}.stages button[aria-current=step] .num{background:var(--teal);color:white;border-color:var(--teal)}.stages .done .num{background:#e7f5d7;border-color:#9ebf76;color:#365d15}main{position:relative;background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:0 18px 60px #17363d12;padding:clamp(20px,4vw,42px);outline:none;min-height:500px}main:before{content:"";position:absolute;top:0;left:42px;width:50px;height:3px;background:var(--cyan);border-radius:0 0 4px 4px}.hero{border-bottom:1px solid var(--line);padding-bottom:21px;margin-bottom:24px}.hero .kicker{margin-bottom:10px}.meta{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.tag{font-size:11px;font-weight:700;letter-spacing:.05em;border:1px solid var(--line);padding:4px 9px;border-radius:20px;color:var(--teal)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid .field{margin:0}.field{display:grid;gap:6px;font-weight:650;font-size:14px;margin-bottom:17px}.field small{font-weight:400}input,textarea{padding:11px 12px;border:1px solid #b9ced3;border-radius:8px;width:100%;min-width:0;background:#fff;font-size:15px}textarea{resize:vertical;min-height:100px;line-height:1.5}textarea.tall{min-height:185px}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px}.split{justify-content:space-between}.notice{background:var(--mist);border-left:3px solid var(--cyan);padding:13px 16px;border-radius:8px;font-size:14px;margin:20px 0}.notice p:last-child{margin-bottom:0}.build-note{border-color:var(--green);background:#f2f8eb}details{border:1px solid var(--line);border-radius:9px;padding:13px 16px;margin-top:18px}summary{cursor:pointer;font-weight:650;font-size:14px}details[open] summary{margin-bottom:14px}.section{border-top:1px solid var(--line);margin-top:25px;padding-top:24px}.section>p{color:var(--muted);font-size:14px}.questions{margin:12px 0;padding-left:22px;font-size:14px;color:var(--muted)}.questions li{margin:7px 0}.prompt-guide{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0}.prompt-guide div{background:var(--mist);border-radius:7px;padding:10px;font-size:12px}.prompt-guide b{display:block;font-size:13px;color:var(--teal);margin-bottom:4px}.prompt{font-family:Consolas,monospace;font-size:14px;min-height:170px}.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:8px 0;cursor:pointer}.check input{width:17px;min-width:17px;height:17px;margin:3px 0;accent-color:var(--teal)}.stage-footer{border-top:1px solid var(--line);padding-top:20px;margin-top:28px;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.stage-footer .check{font-size:12px;max-width:460px}.bottom{display:flex;justify-content:space-between;gap:12px;padding:14px 0 25px;font-size:11px;color:var(--muted)}#status{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;max-width:min(600px,90vw);box-shadow:0 10px 35px #192f3733;z-index:20;font-size:14px}#storage-status{font-size:12px;color:var(--muted);text-align:right}.error{color:#982448!important}.artifact{background:#f8fbfb;border:1px solid var(--line);border-radius:10px;padding:17px;margin-top:14px}.artifact .field{margin-bottom:12px}.artifact h3{word-break:break-word}.code{font-family:Consolas,monospace;font-size:13px;min-height:220px}.attachment{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:10px 0;overflow-wrap:anywhere}.attachment span{min-width:0}.preview{width:100%;height:360px;border:1px solid var(--line);border-radius:8px;background:white;margin-top:12px}.report{max-width:800px;margin:auto}.report .report-heading{font-size:13px;color:var(--teal);letter-spacing:.09em;text-transform:uppercase;margin:22px 0 5px}.report .answer{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}.report table{width:100%;border-collapse:collapse;font-size:13px;margin:15px 0}.report th,.report td{border-bottom:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}.report th{color:var(--teal)}.report pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f8f8;padding:12px;font-size:12px}.rubric-row{display:grid;grid-template-columns:1fr 100px;gap:15px;border-bottom:1px solid var(--line);padding:15px 0;align-items:start}.rubric-row p{font-size:13px;margin-bottom:5px;color:var(--muted)}.rubric-row input{padding:8px}.grade{background:var(--mist);padding:16px;border-radius:8px;margin-top:18px;font-size:18px}.history-item{padding:13px 0;border-top:1px solid var(--line);font-size:13px}.history-item pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:inherit}.import-label{display:inline-flex;cursor:pointer}.empty{color:var(--muted);font-size:14px;padding:16px 0}.project-chip{font-size:12px;color:var(--muted);max-width:400px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.only-print{display:none}.skip{position:absolute;left:12px;top:-60px;background:#fff;padding:10px;z-index:30}.skip:focus{top:8px}@media(max-width:700px){.shell{width:calc(100% - 24px)}header{flex-wrap:wrap;gap:13px;padding:18px 0}.utility{width:100%;justify-content:flex-start;margin-left:0}.session{padding-left:12px}.grid{grid-template-columns:1fr}.prompt-guide{grid-template-columns:1fr 1fr}.stages{gap:1px}.stages button{font-size:9px;min-width:0;padding:8px 1px}.stages .num{width:22px;height:22px;font-size:11px}main:before{left:20px}.rubric-row{grid-template-columns:1fr 80px}.stage-footer .actions{width:100%;justify-content:space-between}.project-chip{max-width:180px}.bottom{font-size:10px}}@media print{body{background:#fff}.shell{width:100%}header,.utility,.stages,.progress-head,.track,.bottom,.no-print,#status,#storage-status,.stage-footer{display:none!important}main{border:0;box-shadow:none;padding:0}main:before{display:none}.only-print{display:block}.report{max-width:none}.report h2,.report h3,.report-heading{break-after:avoid}.report table,.artifact{break-inside:avoid}.report .answer{font-size:11pt}.report pre{font-size:9pt}a{color:inherit}}
</style>

<body>
<a class="skip" href="#workspace">Skip to workspace</a>
<div class="shell">
<header><div class="brand" aria-label="RECODE">RE<span class="c">C</span><span class="o">O</span><span class="d">D</span>E</div><div class="session">SESSION 11<b>AI Project Lab</b></div><div class="utility"><button data-action="export">Export project</button><button data-action="import">Import project</button><button data-action="review">Instructor desk</button><button class="quiet" data-action="help">Session guide</button></div></header>
<div class="progress-head"><span id="project-chip" class="project-chip">Your personal project studio</span><span id="progress-text">0 of 7 stages marked ready</span></div><div class="track" role="progressbar" aria-label="Stages marked ready" aria-valuemin="0" aria-valuemax="7" aria-valuenow="0"><div id="progress-bar" style="width:0"></div></div>
<nav class="stages" aria-label="Project stages" id="stages"></nav>
<main id="workspace" tabindex="-1"></main>
<div class="bottom"><span>RECODE · THINK. CREATE. IMPROVE.</span><span id="storage-status" role="status">Progress saves in this browser</span></div>
</div>
<div id="status" role="status" aria-live="polite" hidden></div><input type="file" id="import-file" accept=".json,application/json" hidden><input type="file" id="attach-file" hidden>
<dialog id="confirm-dialog"><form method="dialog"><h2 id="confirm-title">Replace current project?</h2><p id="confirm-text">Export your current project first if you want to keep it.</p><div class="actions"><button value="cancel">Cancel</button><button class="primary" value="confirm">Replace project</button></div></form></dialog>
<script>
'use strict';
const KEY='recode.session11.studio.v1';
const STAGES=[
{id:'idea',name:'IDEA',title:'YOUR IDEA. YOUR PROJECT.',subtitle:'Think of something you would like to create, improve, organize, or solve. You will use AI to turn your idea into a practical project.',time:'10 min',goal:'Define what you want.'},
{id:'plan',name:'PLAN',title:'Make it possible in 90 minutes.',subtitle:'Choose a small, useful result. Decide what you need to do, then leave plenty of time to build.',time:'10 min',goal:'Decide what needs to be done.'},
{id:'research',name:'RESEARCH',title:'Find out. Compare. Verify.',subtitle:'Gather the information your project needs. Check important claims and choose an approach you can explain.',time:'10 min',goal:'Find information and evaluate alternatives.'},
{id:'build',name:'BUILD',title:'Make something real.',subtitle:'This is the heart of the lab. Use AI to help you create your chosen output, and keep a real copy of your work.',time:'30 min',goal:'Create something practical with AI.'},
{id:'test',name:'TEST',title:'Does your work do its job?',subtitle:'Try your output against your own success criteria. Record what happened, including what did not work.',time:'10 min',goal:'Evaluate what you created.'},
{id:'improve',name:'IMPROVE',title:'Turn feedback into a better result.',subtitle:'Choose a weakness, make a change, and test again. Your decisions should be visible in the finished work.',time:'10 min',goal:'Fix weaknesses and refine the result.'},
{id:'present',name:'PRESENT',title:'Show what you made.',subtitle:'Explain your idea, your output, your use of AI, and your own decisions. Be clear about what is still unfinished.',time:'10 min',goal:'Explain your completed work.'}
];
const RUBRIC=[
{id:'idea',name:'Idea and objective',max:10,description:'A student-owned idea, a clear purpose, and an achievable objective.'},
{id:'plan',name:'Plan and scope',max:15,description:'A practical plan, appropriate constraints, and a useful version for the available time.'},
{id:'research',name:'Research and verification',max:10,description:'Relevant information, credible checks, and reasoned choices between alternatives.'},
{id:'build',name:'Practical output',max:30,description:'A tangible, usable artifact appropriate to the student’s objective. Assess effort, execution, and evidence.'},
{id:'improve',name:'Testing and improvement',max:20,description:'Meaningful testing, honest results, and changes that respond to weaknesses or feedback.'},
{id:'reason',name:'Independent thinking and presentation',max:15,description:'Visible personal decisions, thoughtful use of AI, a clear showcase, and realistic next steps.'}
];
function blank(){return {format:'recode-project-lab',version:1,id:globalThis.crypto?.randomUUID?.()||String(Date.now()),updatedAt:null,stage:0,fields:{},prompts:{},promptHistory:[],ready:{},artifacts:[],attachments:[],review:{scores:{},feedback:'',instructor:'',date:'',basis:null}}}
let project=blank(),view='stage',saveError='',pendingImport=null,reviewErrors={};
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setStatus(message,error=false){const box=$('#status');box.textContent=message;box.classList.toggle('error',error);box.hidden=false;clearTimeout(setStatus.timer);setStatus.timer=setTimeout(()=>box.hidden=true,6500)}
function save(){project.updatedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(project));saveError='';$('#storage-status').textContent='Saved in this browser · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});$('#storage-status').classList.remove('error');return true}catch(e){saveError='Browser storage is unavailable or full. Export your project now to keep your work.';$('#storage-status').textContent=saveError;$('#storage-status').classList.add('error');return false}}
function f(id){return project.fields[id]||''}
function field(id,label,hint='',opts={}){return `<label class="field" for="f-${id}">${esc(label)}${hint?`<small>${esc(hint)}</small>`:''}${opts.input?`<input id="f-${id}" data-field="${id}" value="${esc(f(id))}" maxlength="${opts.max||300}">`:`<textarea id="f-${id}" data-field="${id}" maxlength="30000" ${opts.tall?'class="tall"':''}>${esc(f(id))}</textarea>`}</label>`}
function reflection(id,label){return field(id,label,'Write your own reasoning. A short, specific explanation is enough.')}
function render(focus=false){renderNav();const stage=STAGES[project.stage];let html='';if(view==='review')html=reviewView();else if(view==='help')html=helpView();else if(view==='summary')html=summaryView();else html=`<div class="hero"><div class="kicker">${esc(stage.name)} · ${esc(stage.goal)}</div><h1>${esc(stage.title)}</h1><p class="lede">${esc(stage.subtitle)}</p><div class="meta"><span class="tag">${esc(stage.time)} suggested</span><span class="tag">90-minute studio</span><span class="tag">You choose the output</span></div></div>${stageBody(stage.id)}${promptSection(stage)}<div class="stage-footer no-print"><label class="check"><input type="checkbox" data-ready="${stage.id}" ${project.ready[stage.id]?'checked':''}>I have reviewed this stage and am ready to use it in my project.</label><div class="actions">${project.stage>0?'<button data-action="back">← Back</button>':''}${project.stage<6?`<button class="primary" data-action="next">Next: ${STAGES[project.stage+1].name} →</button>`:'<button class="primary" data-action="summary">View project showcase →</button>'}</div></div>`;$('#workspace').innerHTML=html;if(focus){$('#workspace').focus();window.scrollTo({top:0,behavior:'instant'})}}
function renderNav(){let count=Object.values(project.ready).filter(Boolean).length;$('#progress-text').textContent=`${count} of 7 stages marked ready`;
$('#progress-bar').style.width=(count/7*100)+'%';$('.track').setAttribute('aria-valuenow',count);$('#project-chip').textContent=f('name')||'Your personal project studio';$('#stages').innerHTML=STAGES.map((s,i)=>`<button data-stage="${i}" ${view==='stage'&&i===project.stage?'aria-current="step"':''} class="${project.ready[s.id]?'done':''}" aria-label="${s.name}${project.ready[s.id]?', marked ready':''}"><span class="num">${project.ready[s.id]?'✓':String(i+1).padStart(2,'0')}</span>${s.name}</button>`).join('')}
function stageBody(id){switch(id){case'idea':return `<div class="grid">${field('original','1. What is your project idea?','Start with your own words. It is OK if your idea is still vague.')}${field('why','2. Why do you want to do this project?')}${field('objective','3. What do you want to achieve?')}${field('deliverable','4. What would you like to have completed at the end?','Describe something you can make, show, use, or test.')}</div><button data-action="inspiration" aria-expanded="false" aria-controls="inspiration">I need inspiration</button><div id="inspiration" class="notice" hidden><h3>Ideas can come from anywhere.</h3><p>You might explore a website for a cause you care about, a mobile app prototype, a study guide, a room redesign, a research comparison, an event schedule, or a personal productivity tool.</p><p>These are examples for inspiration only. Write your own project above; it can be completely different.</p></div><div class="section"><h2>Give your idea a little shape.</h2><p>Use the questions that help you. You can revise your idea at any time.</p><div class="grid">${field('audience','Who is this for, and what do they need?','It can be for you, a group of people, or a wider audience.')}${field('constraints','What limits or resources should you consider?','Think about time, tools, skills, available information, materials, or budget if relevant.')}${field('smallest','What is the smallest useful version you can finish today?','If the full project needs weeks, choose one useful part to build in this session.')}${field('revised','How would you describe your idea now?','Revise it freely. Your original idea stays visible in your showcase.')}</div>${field('name','Give your project a working name','You can change this later.',{input:true})}</div>`;
case'plan':return `<div class="notice"><b>Your working idea</b><p>${esc(f('revised')||f('original')||'Return to IDEA and describe the project you want to create.')}</p></div><div class="grid">${field('planned','What exactly will you create in this session?','Choose the format and the smallest useful version. This becomes your planned output.')}${field('success','How will you know it is useful?','Write two or three things you can check during TEST.')}${field('steps','What needs to be done, and in what order?','Use a short list. Reserve about 30 minutes for building.',{tall:true})}${field('resources','What tools, materials, or help do you need?','Include only what your project needs.')}</div>${reflection('planDecision','What did YOU decide about the scope, and why?')}<div class="notice build-note">Keep it small enough to build today. A useful first version is a valid result, even when the wider project is unfinished.</div>`;
case'research':return `<div class="grid">${field('questions','What do you need to find out?','Focus on questions that affect what you will build.')}${field('sources','What sources did you check?','Record links, titles, dates, or observations. You may decide that only a few checks are needed.')}${field('alternatives','What approaches or alternatives did you compare?')}${field('verification','How did you verify the information?','Check important AI claims against a credible source, a calculation, an observation, or a practical test.')}</div>${reflection('researchDecision','What did YOU choose, and why?')}${reflection('disagree','What did AI suggest that you disagreed with?','')}`;
case'build':return `<div class="notice build-note"><b>Build first. Record what is real.</b><p>Work in the tool that fits your idea. You can create an HTML prototype, a document, a design, a spreadsheet, a comparison, a schedule, or another useful artifact. Save a copy here or link to your work.</p></div>${field('plannedBuild','What are you building right now?','Describe the small version you are actively creating. You can adjust your PLAN.')}
${artifactSection()}<div class="section"><h2>Record what you actually made.</h2><div class="grid">${field('actual','What did you actually create?','Describe only work that exists. Adding a file does not automatically mean it is finished.')}${field('incomplete','What remains incomplete?','Be specific. If nothing remains for today’s scope, say so.')}</div>${reflection('buildDecision','What did YOU decide while building?')}${field('aiUse','How did you use AI?','Explain what you asked for, what AI helped with, and what you did yourself.')}</div>`;
case'test':return `<div class="notice"><b>Your success criteria</b><p>${esc(f('success')||'Decide what a useful result should do. You can add your criteria in PLAN.')}</p></div><div class="grid">${field('tests','What did you test, and how?','Try the output yourself or ask someone to use it. Include expected behavior or criteria.')}${field('results','What actually happened?','Record passes, problems, mistakes, or feedback. Do not invent test results.')}${field('weaknesses','What needs attention?','Which weaknesses matter most for your objective?')}${field('testVerification','How did you check accuracy, usefulness, or reliability?','Use a method suited to your output, such as testing a function, checking a source, or reviewing a design.')}</div>${reflection('testDecision','What did YOU decide after testing, and why?')}`;
case'improve':return `<div class="grid">${field('changes','What did you change?','Explain the before and after. If you have not changed anything yet, record that honestly.')}${field('changeWhy','Why did you choose these changes?','Connect the changes to a test result, weakness, or feedback.')}${field('retest','What happened when you tested again?','Record what you actually checked and what still needs work.')}${field('rejected','What AI suggestion did you reject or adapt, and why?','If you did not receive a relevant suggestion, say so.')}</div><div class="notice build-note">Update the artifact in BUILD to keep your latest version with your project. Save an earlier version separately if you want to show the difference.</div><button data-stage="3">Return to BUILD</button>`;
case'present':return `${field('name','Project name','Choose a name for your showcase.',{input:true})}<div class="grid">${field('finalObjective','Project objective','State your final objective in your own words.')}${field('finalOutput','What I created','Describe your real final output, including what someone can use or see.')}${field('finalAI','How I used AI','Describe AI’s contribution and your own contribution.')}${field('finalChanges','What I changed or improved','Refer to a specific decision, test, or revision.')}${field('learned','What I learned')}${field('next','Next steps','What would you do next, and what still needs to be finished?')}</div>${reflection('ownership','Which decisions made this project yours?')}<div class="notice"><b>Your showcase is built from your records.</b><p>Blank answers are shown as “Not recorded.” The app does not invent outputs, tests, or completed work. Your instructor reviews quality and effort using a 100-point rubric.</p></div><div class="actions"><button class="primary" data-action="summary">Generate project summary</button><button data-action="export">Export to continue later</button></div>`;
}}
function promptSection(stage){const entry=project.prompts[stage.id]||{text:'',notes:'',checks:{}};return `<section class="section no-print" aria-labelledby="prompt-heading"><div class="kicker">AI as your project assistant</div><h2 id="prompt-heading">Write your own prompt.</h2><p>Use these ingredients in your own words. The editor starts blank. This studio is not connected to ChatGPT; copy your prompt and use it in your own ChatGPT chat.</p><div class="prompt-guide"><div><b>Context</b>What does AI need to know?</div><div><b>Objective</b>What are you trying to achieve?</div><div><b>Constraints</b>What limits must AI respect?</div><div><b>Output</b>What specific result do you need?</div><div><b>Missing details</b>Ask AI what information is missing.</div></div><label class="field" for="prompt-text">Your ${esc(stage.name.toLowerCase())} prompt<textarea id="prompt-text" class="prompt" data-prompt="text" maxlength="30000">${esc(entry.text)}</textarea></label><div class="actions"><button data-action="copy-prompt">Copy Prompt</button><button data-action="save-prompt">Save prompt version</button><a class="button" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">Open ChatGPT ↗</a></div><details><summary>Review and improve your prompt</summary><p class="muted">Check your own work. These checks do not award marks.</p>${['I gave enough context.','I explained my objective.','I mentioned relevant constraints.','I requested a specific output.','I asked AI to identify missing information.'].map((label,i)=>`<label class="check"><input type="checkbox" data-prompt-check="${i}" ${entry.checks?.[i]?'checked':''}>${label}</label>`).join('')}<p class="muted">Try the prompt in ChatGPT. Decide what helped, then revise your prompt above and save another version.</p></details><label class="field" style="margin-top:18px" for="prompt-notes">What did you use, change, or question in AI’s response?<small>Summarize the useful parts and your reasoning. Keep your actual artifact in BUILD.</small><textarea id="prompt-notes" data-prompt="notes" maxlength="30000">${esc(entry.notes)}</textarea></label><details><summary>Saved prompt versions (${project.promptHistory.filter(p=>p.stage===stage.id).length})</summary>${project.promptHistory.filter(p=>p.stage===stage.id).map(p=>`<div class="history-item"><small>${esc(new Date(p.date).toLocaleString())}</small><pre>${esc(p.text)}</pre><button data-action="restore-prompt" data-id="${esc(p.id)}">Use this version</button></div>`).join('')||'<p class="empty">No versions saved yet.</p>'}</details></section>`}
function artifactSection(){return `<section class="section"><h2>Your practical output</h2><p>Keep work you can show, use, or test. Write or paste a text artifact, attach a file from another tool, or record a link. An outline alone may not be enough for your chosen objective.</p><div class="actions"><button data-action="add-artifact">+ Add text or code artifact</button><button data-action="attach">Attach a file</button></div><small>Attachments: up to 1 MB in total, included in project exports. Keep larger files in your own storage and record a link below.</small><div id="artifact-list">${project.artifacts.map(a=>`<div class="artifact" data-artifact-container="${esc(a.id)}"><label class="field">File name<input data-artifact="${esc(a.id)}" data-prop="name" value="${esc(a.name)}" maxlength="150"></label><label class="field">Artifact content<small>Write or paste your actual work. Use a .html file name to preview a web prototype.</small><textarea class="code" data-artifact="${esc(a.id)}" data-prop="content" maxlength="500000" spellcheck="false">${esc(a.content)}</textarea></label><div class="actions"><button data-action="download-artifact" data-id="${esc(a.id)}">Download artifact</button><button data-action="preview-artifact" data-id="${esc(a.id)}">Preview HTML</button><button class="quiet danger" data-action="remove-artifact" data-id="${esc(a.id)}">Remove</button></div><div id="preview-${esc(a.id)}"></div></div>`).join('')}</div>${project.attachments.map(a=>`<div class="attachment"><span>${esc(a.name)} <small>· ${Math.ceil(a.size/1024)} KB</small></span><div class="actions"><button data-action="download-attachment" data-id="${esc(a.id)}">Download</button><button class="quiet danger" data-action="remove-attachment" data-id="${esc(a.id)}">Remove</button></div></div>`).join('')}<div class="grid" style="margin-top:20px">${field('artifactLink','Link to your output (optional)','Paste an https:// or http:// link to work saved elsewhere.',{input:true,max:2000})}${field('artifactAccess','How can someone view or use your output?','Include access instructions, tool names, or the name of a larger file saved separately.')}</div></section>`}
function answer(label,value){return `<h3 class="report-heading">${esc(label)}</h3><div class="answer">${esc(value?.trim()||'Not recorded.')}</div>`}
function reviewBasis(){return JSON.stringify({fields:project.fields,prompts:project.prompts,promptHistory:project.promptHistory,artifacts:project.artifacts,attachments:project.attachments.map(a=>({id:a.id,name:a.name,data:a.data})),ready:project.ready})}
function gradeInfo(){const all=RUBRIC.every(r=>Number.isFinite(project.review.scores[r.id])&&project.review.scores[r.id]>=0&&project.review.scores[r.id]<=r.max);const sum=RUBRIC.reduce((n,r)=>n+(Number(project.review.scores[r.id])||0),0);const stale=project.review.basis&&project.review.basis!==reviewBasis();return {all,sum,stale,final:all&&!!project.review.date&&!stale}}
function gradeHtml(){let g=gradeInfo();return `<div class="grade">${g.final?`Instructor-reviewed score: <b>${g.sum} / 100</b>`:g.stale?'Project changed after review · instructor review needs updating.':g.all?`Draft instructor score: ${g.sum} / 100 · review not finalized`:'Awaiting instructor review · no final score'}<br><small>Quality and effort are evaluated by the instructor. Stage readiness is self-reported.</small></div>`}
function summaryView(){return `<div class="no-print actions" style="margin:0 0 25px"><button data-action="return">← Return to workspace</button><button data-action="download-summary">Download summary</button><button data-action="export">Export full project</button><button data-action="print">Print / Save PDF</button></div><article class="report"><div class="kicker">RECODE · SESSION 11 · PROJECT SHOWCASE</div><h1>${esc(f('name')||'Untitled project')}</h1><p class="muted">Student-recorded work · ${esc(new Date().toLocaleDateString())}</p>${answer('PROJECT OBJECTIVE',f('finalObjective')||f('objective'))}${answer('ORIGINAL PROJECT IDEA',f('original'))}${answer('REFINED PROJECT IDEA',f('revised'))}${answer('WHY I CHOSE THIS PROJECT',f('why'))}${answer('WHAT I PLANNED TO CREATE',f('planned')||f('deliverable'))}${answer('WHAT I CREATED',f('finalOutput')||f('actual'))}${answer('WHAT REMAINS INCOMPLETE',f('incomplete'))}${answer('HOW I USED AI',f('finalAI')||f('aiUse'))}${answer('WHAT I CHANGED OR IMPROVED',f('finalChanges')||f('changes'))}${answer('WHAT I LEARNED',f('learned'))}${answer('NEXT STEPS',f('next'))}${answer('MY OWN DECISIONS',f('ownership'))}${answer('AI SUGGESTIONS I QUESTIONED',f('rejected')||f('disagree'))}${answer('HOW I VERIFIED INFORMATION',f('verification'))}${answer('TESTS AND ACTUAL RESULTS',[f('tests'),f('results')].filter(Boolean).join('\n\n'))}${answer('RETEST RESULTS',f('retest'))}<h3 class="report-heading">OUTPUT EVIDENCE</h3>${evidenceHtml()}<details class="no-print"><summary>Full project notebook and prompt record</summary>${notebookHtml()}</details><h3 class="report-heading">INSTRUCTOR EVALUATION</h3>${gradeHtml()}${reviewTable()}${answer('INSTRUCTOR FEEDBACK',project.review.feedback)}${project.review.date?`<p class="muted">Reviewed by ${esc(project.review.instructor||'Unnamed instructor')} · ${esc(new Date(project.review.date).toLocaleString())}</p>`:''}</article>`}
function safeLink(value){try{let url=new URL(value);return ['https:','http:'].includes(url.protocol)?url.href:null}catch(e){return null}}
function evidenceHtml(){const url=safeLink(f('artifactLink'));return `<p>${project.artifacts.length} text/code artifact(s) · ${project.attachments.length} attached file(s). Artifacts are student-supplied evidence; completion is not verified by the app.</p>${project.artifacts.map(a=>`<div class="artifact"><h3>${esc(a.name||'Untitled artifact')}</h3><pre>${esc(a.content)}</pre><button class="no-print" data-action="download-artifact" data-id="${esc(a.id)}">Download artifact</button></div>`).join('')}${project.attachments.map(a=>`<p>${esc(a.name)} · ${Math.ceil(a.size/1024)} KB <button class="no-print" data-action="download-attachment" data-id="${esc(a.id)}">Download file</button></p>`).join('')}${url?`<p><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">Open student output ↗</a></p>`:f('artifactLink')?`<p>Recorded link (not a valid web URL): ${esc(f('artifactLink'))}</p>`:''}${answer('OUTPUT ACCESS NOTES',f('artifactAccess'))}`}
function notebookHtml(){return Object.entries(project.fields).filter(([,v])=>v.trim()).map(([k,v])=>answer(FIELD_LABELS[k]||k,v)).join('')+STAGES.map(s=>{let p=project.prompts[s.id];return p&&(p.text||p.notes)?answer(s.name+' · CURRENT PROMPT',p.text)+answer(s.name+' · AI REFLECTION',p.notes):''}).join('')+project.promptHistory.map(p=>answer(p.stage.toUpperCase()+' · SAVED PROMPT · '+new Date(p.date).toLocaleString(),p.text)).join('')}
function reviewTable(){return `<table><thead><tr><th>Criterion</th><th>Instructor points</th><th>Available</th></tr></thead><tbody>${RUBRIC.map(r=>`<tr><td>${esc(r.name)}</td><td>${project.review.scores[r.id]??'—'}</td><td>${r.max}</td></tr>`).join('')}</tbody></table>`}
function reviewView(){return `<div class="hero"><div class="kicker">Instructor desk</div><h1>Review the work. Recognize the thinking.</h1><p class="lede">Review this project or import a student’s exported JSON. Award points yourself, using the work and the student’s decisions as evidence.</p></div><div class="notice"><b>Local review, without accounts.</b><p>This desk has no login or teacher authentication. Scores are entered by a person, never generated from keywords. Use exported files to exchange work and return feedback. Import replaces the project currently open in this browser, after confirmation.</p></div><div class="actions"><button data-action="summary">View project and evidence</button><button data-action="import">Import student project</button><button data-action="export">Export with feedback</button><button data-action="return">Return to workspace</button></div><div class="section"><h2>${esc(f('name')||'Untitled project')}</h2>${field('student','Student name (optional)','Used in the exported project and review.',{input:true})}<p class="muted">Assess against the student’s objective and chosen output. Consider the session’s 90-minute scope.</p>${RUBRIC.map(r=>`<div class="rubric-row"><div><label for="score-${r.id}"><b>${esc(r.name)} · ${r.max} points</b></label><p>${esc(r.description)}</p></div><div><input id="score-${r.id}" data-score="${r.id}" type="number" min="0" max="${r.max}" step="1" value="${project.review.scores[r.id]??''}" aria-label="${esc(r.name)} score out of ${r.max}"><small id="score-error-${r.id}" class="error">${esc(reviewErrors[r.id]||'')}</small></div></div>`).join('')}<div id="grade-display">${gradeHtml()}</div><label class="field" style="margin-top:20px">Instructor name<input data-review="instructor" maxlength="150" value="${esc(project.review.instructor)}"></label><label class="field">Instructor feedback<textarea data-review="feedback" maxlength="30000">${esc(project.review.feedback)}</textarea></label><div class="actions"><button class="primary" data-action="finalize-review">Finalize instructor review</button><button data-action="export">Export reviewed project</button></div></div>`}
function helpView(){return `<div class="hero"><div class="kicker">Session guide</div><h1>Your idea leads the way.</h1><p class="lede">Bring a project you care about. Use this workspace to organize it and ChatGPT to help create it. Make your own decisions, then test and improve your work.</p></div><ol class="questions">${STAGES.map(s=>`<li><b>${s.name} · ${s.time}</b> — ${s.goal}</li>`).join('')}</ol><div class="notice build-note"><b>Spend time building.</b><p>Choose a small output you can start and use in this session. Your full ambition may need more time. Record both what exists and what is still unfinished.</p></div><h2>Keep your work</h2><p>Progress saves on this device in this browser when storage is available. Keep one working tab open. Use <b>Export project</b> to download a JSON backup with your notebook, prompts, artifacts, and instructor feedback. Import it to continue on another device or in a future session.</p><p>Text and code artifacts can be downloaded separately. Attachments up to 1 MB total are included in the JSON export. Larger work stays in the tool or storage you choose; record a link and check that your instructor can open it.</p><p>Use <b>Download summary</b> for a readable Markdown showcase, or <b>Print / Save PDF</b> from the showcase. The full JSON project is the editable backup.</p><h2>Work with ChatGPT</h2><p>There is no AI connection in this app. Write your own prompt, copy it, open ChatGPT, and decide how to use the response. Check facts and keep your own reasoning visible.</p><h2>Instructor evaluation</h2><p>Stage checkmarks show only what you have marked ready. They are not grades. The instructor enters points for six criteria totaling 100. A finalized review is marked for updating when project evidence changes.</p><details><summary>100-point rubric</summary>${RUBRIC.map(r=>`<p><b>${esc(r.name)} · ${r.max}</b><br>${esc(r.description)}</p>`).join('')}</details><div class="actions"><button class="primary" data-action="return">Back to my project</button><button data-action="export">Export project</button></div><details><summary>Start a new project</summary><p>Export your current project first. Starting again clears the current browser checkpoint.</p><button class="danger" data-action="reset">Start a blank project</button></details>`}
const FIELD_LABELS={original:'Original project idea',why:'Why I chose it',objective:'Project objective',deliverable:'Desired output',audience:'Audience and needs',constraints:'Constraints and resources',smallest:'Smallest useful version',revised:'Revised idea',name:'Project name',planned:'Planned output',success:'Success criteria',steps:'Plan of work',resources:'Tools and materials',planDecision:'My scope decision',questions:'Research questions',sources:'Sources checked',alternatives:'Alternatives compared',verification:'Information verification',researchDecision:'My research decision',disagree:'AI suggestions I disagreed with',plannedBuild:'Current build scope',actual:'What I actually created',incomplete:'Incomplete work',buildDecision:'My build decisions',aiUse:'How I used AI',artifactLink:'Output link',artifactAccess:'Output access notes',tests:'Test method',results:'Actual test results',weaknesses:'Weaknesses',testVerification:'Output verification',testDecision:'My testing decision',changes:'Changes made',changeWhy:'Reasons for changes',retest:'Retest results',rejected:'AI suggestions rejected or adapted',finalObjective:'Final objective',finalOutput:'Final output',finalAI:'AI contribution',finalChanges:'Final improvements',learned:'What I learned',next:'Next steps',ownership:'My own decisions',student:'Student name'};
function uid(){return globalThis.crypto?.randomUUID?.()||'a'+Date.now()+Math.random().toString(36).slice(2)}
function download(name,content,type='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=filename(name);document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function filename(v){return (v||'project').replace(/[<>:"/\\|?*\x00-\x1f]/g,'-').slice(0,150)||'project'}
function exportProject(){save();download((f('name')||'RECODE-Session-11')+'.json',JSON.stringify(project,null,2),'application/json');setStatus('Project exported. Keep the JSON file to continue or share it for review.')}
async function copy(text){if(!text.trim()){setStatus('Write your own prompt first.');return}try{await navigator.clipboard.writeText(text);setStatus('Prompt copied. Paste it into your ChatGPT chat.')}catch(e){let ta=$('#prompt-text');if(ta){ta.focus();ta.select()}setStatus('Copy is unavailable here. Your prompt is selected; use Ctrl+C or your device’s Copy command.')}}
function markdown(){let lines=['# '+(f('name')||'Untitled project'),'RECODE Session 11 · AI Project Lab',f('student')?'Student: '+f('student'):'',''];const sections=[['PROJECT OBJECTIVE',f('finalObjective')||f('objective')],['ORIGINAL PROJECT IDEA',f('original')],['REFINED PROJECT IDEA',f('revised')],['WHAT I PLANNED TO CREATE',f('planned')||f('deliverable')],['WHAT I CREATED',f('finalOutput')||f('actual')],['WHAT REMAINS INCOMPLETE',f('incomplete')],['HOW I USED AI',f('finalAI')||f('aiUse')],['WHAT I CHANGED OR IMPROVED',f('finalChanges')||f('changes')],['WHAT I LEARNED',f('learned')],['NEXT STEPS',f('next')],['MY OWN DECISIONS',f('ownership')],['HOW I VERIFIED INFORMATION',f('verification')],['TEST METHOD',f('tests')],['ACTUAL TEST RESULTS',f('results')],['RETEST RESULTS',f('retest')],['OUTPUT LINK',f('artifactLink')],['OUTPUT ACCESS NOTES',f('artifactAccess')]];for(const [k,v]of sections)lines.push('## '+k,v?.trim()||'Not recorded.','');lines.push('## ARTIFACT INVENTORY',...project.artifacts.map(a=>'- '+a.name),...project.attachments.map(a=>'- '+a.name+' (attached file)'),project.artifacts.length+project.attachments.length?'':'No embedded artifacts recorded.','Artifact contents and attached files are included in the full JSON project export.','');const g=gradeInfo();lines.push('## INSTRUCTOR EVALUATION',g.final?`Instructor-reviewed score: ${g.sum} / 100`:g.stale?'Review needs updating after project changes.':'Awaiting finalized instructor review.',...RUBRIC.map(r=>`${r.name}: ${project.review.scores[r.id]??'Not reviewed'} / ${r.max}`),'',project.review.feedback||'No instructor feedback recorded.');return lines.join('\n')}
function validate(raw){if(!raw||raw.format!=='recode-project-lab'||raw.version!==1||typeof raw.id!=='string')throw Error('This is not a supported RECODE Session 11 project.');const p=blank();p.id=raw.id.slice(0,150);p.stage=Number.isInteger(raw.stage)&&raw.stage>=0&&raw.stage<7?raw.stage:0;p.updatedAt=typeof raw.updatedAt==='string'?raw.updatedAt:null;for(const k of Object.keys(FIELD_LABELS)){if(typeof raw.fields?.[k]==='string')p.fields[k]=raw.fields[k].slice(0,30000)}for(const s of STAGES){if(typeof raw.prompts?.[s.id]?.text==='string'||typeof raw.prompts?.[s.id]?.notes==='string'){const x=raw.prompts[s.id];p.prompts[s.id]={text:typeof x.text==='string'?x.text.slice(0,30000):'',notes:typeof x.notes==='string'?x.notes.slice(0,30000):'',checks:{}};for(let i=0;i<5;i++)p.prompts[s.id].checks[i]=x.checks?.[i]===true}p.ready[s.id]=raw.ready?.[s.id]===true}if(Array.isArray(raw.promptHistory))p.promptHistory=raw.promptHistory.slice(0,300).filter(x=>x&&STAGES.some(s=>s.id===x.stage)&&typeof x.text==='string').map(x=>({id:uid(),stage:x.stage,text:x.text.slice(0,30000),date:validDate(x.date)}));if(Array.isArray(raw.artifacts))p.artifacts=raw.artifacts.slice(0,20).filter(x=>x&&typeof x.content==='string').map(x=>({id:uid(),name:String(x.name||'artifact.txt').slice(0,150),content:x.content.slice(0,500000)}));let total=0;if(Array.isArray(raw.attachments))for(const a of raw.attachments.slice(0,20)){if(!a||typeof a.data!=='string'||!/^data:application\/octet-stream;base64,[A-Za-z0-9+/]*={0,2}$/.test(a.data))continue;const bytes=Math.floor(a.data.split(',')[1].length*3/4);if(total+bytes>1050000)throw Error('Attached files exceed the 1 MB project limit.');total+=bytes;p.attachments.push({id:uid(),name:String(a.name||'attachment').slice(0,150),size:bytes,data:a.data})}for(const r of RUBRIC){const n=raw.review?.scores?.[r.id];if(typeof n==='number'&&Number.isInteger(n)&&n>=0&&n<=r.max)p.review.scores[r.id]=n}for(const k of ['feedback','instructor'])if(typeof raw.review?.[k]==='string')p.review[k]=raw.review[k].slice(0,30000);p.review.date=raw.review?.date?validDate(raw.review.date):'';/* Preserve finalized review only when the imported evidence matches its own review record. */const old=project;project=p;const rawEvidence=JSON.stringify({fields:raw.fields,prompts:raw.prompts,promptHistory:raw.promptHistory,artifacts:raw.artifacts,attachments:(raw.attachments||[]).map(a=>({id:a.id,name:a.name,data:a.data})),ready:raw.ready});if(typeof raw.review?.basis==='string')p.review.basis=raw.review.basis===rawEvidence?reviewBasis():'Evidence changed since review';project=old;return p}
function validDate(value){return typeof value==='string'&&Number.isFinite(Date.parse(value))?new Date(value).toISOString():new Date().toISOString()}
async function confirmReplace(title,text,button='Replace project'){const d=$('#confirm-dialog');$('#confirm-title').textContent=title;$('#confirm-text').textContent=text;d.querySelector('button[value="confirm"]').textContent=button;d.showModal();return new Promise(resolve=>d.addEventListener('close',()=>resolve(d.returnValue==='confirm'),{once:true}))}
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.field){project.fields[el.dataset.field]=el.value;save();renderNav()}else if(el.dataset.prompt){const id=STAGES[project.stage].id;project.prompts[id]??={text:'',notes:'',checks:{}};project.prompts[id][el.dataset.prompt]=el.value;save()}else if(el.dataset.artifact){const a=project.artifacts.find(a=>a.id===el.dataset.artifact);if(a){a[el.dataset.prop]=el.value;save()}}else if(el.dataset.score){const r=RUBRIC.find(r=>r.id===el.dataset.score),n=Number(el.value);if(el.value===''){delete project.review.scores[r.id];delete reviewErrors[r.id]}else if(!Number.isInteger(n)||n<0||n>r.max||!el.validity.valid){reviewErrors[r.id]=`Enter 0–${r.max}.`;delete project.review.scores[r.id]}else{project.review.scores[r.id]=n;delete reviewErrors[r.id]}$('#score-error-'+r.id).textContent=reviewErrors[r.id]||'';project.review.date='';save();$('#grade-display').innerHTML=gradeHtml()}else if(el.dataset.review){project.review[el.dataset.review]=el.value;project.review.date='';save();$('#grade-display').innerHTML=gradeHtml()}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.ready){project.ready[el.dataset.ready]=el.checked;save();renderNav()}if(el.dataset.promptCheck){const id=STAGES[project.stage].id;project.prompts[id]??={text:'',notes:'',checks:{}};project.prompts[id].checks[el.dataset.promptCheck]=el.checked;save()}});
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action],[data-stage]');if(!el)return;if(el.dataset.stage!==undefined){project.stage=Number(el.dataset.stage);view='stage';save();render(true);return}const action=el.dataset.action,id=el.dataset.id;switch(action){case'next':project.stage=Math.min(6,project.stage+1);view='stage';save();render(true);break;case'back':project.stage=Math.max(0,project.stage-1);save();render(true);break;case'return':view='stage';render(true);break;case'help':view='help';render(true);break;case'review':view='review';render(true);break;case'summary':save();view='summary';render(true);break;case'export':exportProject();break;case'import':$('#import-file').click();break;case'print':window.print();break;case'download-summary':download((f('name')||'project')+'-summary.md',markdown(),'text/markdown;charset=utf-8');break;case'inspiration':{const open=$('#inspiration').hidden;$('#inspiration').hidden=!open;el.setAttribute('aria-expanded',String(open));break}case'copy-prompt':await copy(project.prompts[STAGES[project.stage].id]?.text||'');break;case'save-prompt':{const s=STAGES[project.stage].id,text=project.prompts[s]?.text||'';if(!text.trim()){setStatus('Write your own prompt before saving a version.');break}if(project.promptHistory.length>=300){setStatus('Prompt history is full. Export this project to keep the versions.');break}project.promptHistory.push({id:uid(),stage:s,text,date:new Date().toISOString()});save();render();setStatus('Prompt version saved. You can revise the editor and save another.');break}case'restore-prompt':{const h=project.promptHistory.find(h=>h.id===id);if(h){const s=STAGES[project.stage].id;project.prompts[s]??={text:'',notes:'',checks:{}};const current=project.prompts[s].text;if(current&&current!==h.text&&project.promptHistory.length<300)project.promptHistory.push({id:uid(),stage:s,text:current,date:new Date().toISOString()});project.prompts[s].text=h.text;save();render();setStatus('Saved version restored. Your previous draft was kept in history.')}break}case'add-artifact':if(project.artifacts.length>=20){setStatus('You can keep up to 20 text artifacts in this project.');break}project.artifacts.push({id:uid(),name:'my-artifact.txt',content:''});save();render();break;case'attach':$('#attach-file').click();break;case'download-artifact':{const a=project.artifacts.find(a=>a.id===id);if(a)download(a.name,a.content);break}case'remove-artifact':if(await confirmReplace('Remove this artifact?','This removes it from the current project. Download it first if you need a copy.','Remove artifact')){project.artifacts=project.artifacts.filter(a=>a.id!==id);save();render()}break;case'preview-artifact':{const a=project.artifacts.find(a=>a.id===id);if(!a)break;if(!/\.html?$/i.test(a.name)){setStatus('Use a .html file name to preview an HTML prototype.');break}const holder=document.getElementById('preview-'+id);holder.replaceChildren();const frame=document.createElement('iframe');frame.className='preview';frame.title='Student HTML prototype preview';frame.setAttribute('sandbox','allow-scripts');frame.referrerPolicy='no-referrer';frame.srcdoc=a.content;holder.append(frame);break}case'remove-attachment':if(await confirmReplace('Remove this file?','This removes the attachment from the current project. Keep an external copy if you need it.','Remove file')){project.attachments=project.attachments.filter(a=>a.id!==id);save();render()}break;case'download-attachment':{const a=project.attachments.find(a=>a.id===id);if(a){const bytes=Uint8Array.from(atob(a.data.split(',')[1]),c=>c.charCodeAt(0));download(a.name,bytes,'application/octet-stream')}break}case'finalize-review':{const g=gradeInfo();if(!g.all||Object.keys(reviewErrors).length){setStatus('Enter a valid whole-number score for all six criteria before finalizing.',true);break}if(!project.review.instructor.trim()){setStatus('Enter the instructor’s name before finalizing.',true);break}project.review.basis=reviewBasis();project.review.date=new Date().toISOString();save();render();setStatus('Instructor review finalized. Export the project to return the feedback.');break}case'reset':if(await confirmReplace('Start a blank project?','Export your current project first if you want to keep it. This replaces the current browser checkpoint.','Start blank project')){project=blank();view='stage';reviewErrors={};save();render(true)}break}});
$('#import-file').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>16*1024*1024)throw Error('This project is too large to import (16 MB maximum).');pendingImport=validate(JSON.parse(await file.text()));if(await confirmReplace('Open this project?','This will replace the current browser checkpoint. Export your current project first if you want to keep it.','Open imported project')){project=pendingImport;reviewErrors={};view='stage';save();render(true);setStatus('Project imported. Continue building or open the instructor desk.')}pendingImport=null}catch(error){setStatus(error.message||'Could not import this project.',true)}});
$('#attach-file').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;const total=project.attachments.reduce((n,a)=>n+a.size,0);if(project.attachments.length>=20||total+file.size>1024*1024){setStatus('Keep attachments under 1 MB total (up to 20 files). Record a link for larger work.',true);return}try{const bytes=new Uint8Array(await file.arrayBuffer());let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));project.attachments.push({id:uid(),name:file.name,size:file.size,data:'data:application/octet-stream;base64,'+btoa(binary)});const ok=save();render();setStatus(ok?'File attached and included in project exports.':saveError,!ok)}catch(error){setStatus('The file could not be attached. Keep a copy externally and record its link.',true)}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-stage]');if(!el||f('original').trim())return;if((el.dataset.stage!==undefined&&Number(el.dataset.stage)>0)||el.dataset.action==='next'){e.stopImmediatePropagation();project.stage=0;view='stage';save();render(true);$('#f-original').focus();setStatus('Enter your own project idea first. A rough idea is enough.')}},true);
window.addEventListener('storage',e=>{if(e.key===KEY)setStatus('Another tab changed this project. Export this tab’s work before reloading if you need to keep both versions.',true)});
try{const saved=localStorage.getItem(KEY);if(saved)project=validate(JSON.parse(saved));}catch(e){saveError='Saved progress could not be loaded. Import an exported project or start here.';}
render();if(saveError){$('#storage-status').textContent=saveError;$('#storage-status').classList.add('error')}
</script>
</body>
